name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokeori-production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/aetheruk/pokeori-production

jobs:
  build-and-publish:
    name: Build and publish private GHCR image
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confirm the stable build key is configured
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ]; then
            echo 'Set NEXT_SERVER_ACTIONS_ENCRYPTION_KEY in GitHub Actions secrets.' >&2
            exit 1
          fi

      - name: Confirm Coolify deploy credentials are configured
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo 'Set COOLIFY_WEBHOOK and COOLIFY_TOKEN in GitHub Actions secrets.' >&2
            exit 1
          fi

      - name: Read package version
        id: package-version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Verify the GHCR package is private and unlinked
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
          PACKAGE_NAME: pokeori-production
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Set GHCR_PUSH_TOKEN in GitHub Actions secrets.' >&2
            exit 1
          fi
          visibility="$(gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}" --jq '.visibility')"
          linked_repository="$(gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}" --jq '.repository.full_name // ""')"
          if [ "$visibility" != 'private' ] || [ -n "$linked_repository" ]; then
            echo 'Create pokeori-production as a private, unlinked GHCR package before publishing.' >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Keep two release images before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: pokeori-production
        run: |
          gh api --paginate --slurp \
            "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            > "$RUNNER_TEMP/ghcr-package-versions.json"

          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const versions = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/ghcr-package-versions.json`, 'utf8'),
          ).flat()
          const releaseTag = /^v(\d+)\.(\d+)\.(\d+)$/
          const releases = versions.flatMap((version) => {
            const tag = version.metadata?.container?.tags?.find((value) => releaseTag.test(value))
            if (!tag) return []
            const [, major, minor, patch] = tag.match(releaseTag)
            return [{ version, tag, semver: [Number(major), Number(minor), Number(patch)] }]
          }).sort((left, right) => {
            for (let index = 0; index < 3; index += 1) {
              const difference = right.semver[index] - left.semver[index]
              if (difference !== 0) return difference
            }
            return right.version.created_at.localeCompare(left.version.created_at)
          })
          const keepIds = new Set(releases.slice(0, 2).map(({ version }) => version.id))
          if (keepIds.size === 0) {
            const bootstrap = versions.find((version) =>
              version.metadata?.container?.tags?.includes('bootstrap'),
            )
            if (bootstrap) keepIds.add(bootstrap.id)
          }

          for (const version of versions) {
            if (keepIds.has(version.id)) continue
            execFileSync(
              'gh',
              [
                'api',
                '--method',
                'DELETE',
                `users/${process.env.GITHUB_REPOSITORY_OWNER}/packages/container/${process.env.PACKAGE_NAME}/versions/${version.id}`,
              ],
              { stdio: 'inherit' },
            )
          }
          console.log(`Kept ${keepIds.size} previous release image(s) before publishing`)
          NODE

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v${{ steps.package-version.outputs.value }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.package-version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.package-version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          secrets: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

      - name: Enforce a three-version GHCR limit
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: pokeori-production
          RELEASE_TAG: v${{ steps.package-version.outputs.value }}
        run: |
          gh api --paginate --slurp \
            "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            > "$RUNNER_TEMP/ghcr-package-versions.json"

          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')

          const versions = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/ghcr-package-versions.json`, 'utf8'),
          ).flat()
          const releaseTag = /^v(\d+)\.(\d+)\.(\d+)$/
          const releases = versions
            .flatMap((version) => {
              const tag = version.metadata?.container?.tags?.find((value) => releaseTag.test(value))
              if (!tag) return []
              const [, major, minor, patch] = tag.match(releaseTag)
              return [{ version, tag, semver: [Number(major), Number(minor), Number(patch)] }]
            })
            .sort((left, right) => {
              for (let index = 0; index < 3; index += 1) {
                const difference = right.semver[index] - left.semver[index]
                if (difference !== 0) return difference
              }
              return right.version.created_at.localeCompare(left.version.created_at)
            })
          if (!releases.some(({ tag }) => tag === process.env.RELEASE_TAG)) {
            throw new Error(`Published release ${process.env.RELEASE_TAG} was not found in GHCR`)
          }
          const keepIds = new Set(releases.slice(0, 3).map(({ version }) => version.id))

          for (const version of versions) {
            if (keepIds.has(version.id)) continue
            execFileSync(
              'gh',
              [
                'api',
                '--method',
                'DELETE',
                `users/${process.env.GITHUB_REPOSITORY_OWNER}/packages/container/${process.env.PACKAGE_NAME}/versions/${version.id}`,
              ],
              { stdio: 'inherit' },
            )
          }

          console.log(`Retained ${keepIds.size} GHCR release image version(s)`)
          NODE

  deploy:
    name: Trigger Coolify image deployment
    needs: build-and-publish
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo 'Set COOLIFY_WEBHOOK and COOLIFY_TOKEN in GitHub Actions secrets.' >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

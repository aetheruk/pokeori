name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokeori-production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/aetheruk/pokeori-production

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run security:audit

  build-and-publish:
    name: Build and publish private GHCR image
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confirm the stable build key is configured
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ]; then
            echo 'Set NEXT_SERVER_ACTIONS_ENCRYPTION_KEY in GitHub Actions secrets.' >&2
            exit 1
          fi

      - name: Confirm Coolify deploy credentials are configured
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo 'Set COOLIFY_WEBHOOK and COOLIFY_TOKEN in GitHub Actions secrets.' >&2
            exit 1
          fi

      - name: Read package version
        id: package-version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Verify the GHCR package is private and unlinked
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
          PACKAGE_NAME: pokeori-production
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Set GHCR_PUSH_TOKEN in GitHub Actions secrets.' >&2
            exit 1
          fi
          visibility="$(gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}" --jq '.visibility')"
          linked_repository="$(gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}" --jq '.repository.full_name // ""')"
          if [ "$visibility" != 'private' ] || [ -n "$linked_repository" ]; then
            echo 'Create pokeori-production as a private, unlinked GHCR package before publishing.' >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v${{ steps.package-version.outputs.value }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.package-version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.package-version.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          secrets: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

  deploy:
    name: Trigger Coolify image deployment
    needs: build-and-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo 'Set COOLIFY_WEBHOOK and COOLIFY_TOKEN in GitHub Actions secrets.' >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

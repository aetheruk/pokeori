services:
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, audit-rs, --bind_ip_all]
    ports:
      - "127.0.0.1:27028:27017"
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /data/db
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:6399:6379"
    tmpfs:
      - /data
